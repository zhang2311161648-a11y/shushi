name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :core:data:testDebugUnitTest :core:domain:testDebugUnitTest :core:model:testDebugUnitTest :feature:analysis:testDebugUnitTest --no-configuration-cache --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shushi-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
